name: Feature request
description: Suggest a new capability or improvement.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem is this solving?
      description: Describe the situation where the current behavior breaks down.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How you'd want it to work. Sketches, pseudo-code, or API shapes welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: input
    id: workaround
    attributes:
      label: Are you blocked? (workaround in place?)
      placeholder: "Yes — falling back to manual screenshots."
    validations:
      required: false
