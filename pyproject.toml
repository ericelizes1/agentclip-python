[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'agentclip'
version = '0.4.0'
description = 'Turn AI agent QA runs into shareable slideshows.'
readme = 'README.md'
requires-python = '>=3.11'
license = { text = 'MIT' }
authors = [{ name = 'Eric Elizes', email = 'eric@elizes.dev' }]
keywords = ['mcp', 'ai-agents', 'qa', 'slideshow', 'claude-code']
classifiers = [
    'Development Status :: 3 - Alpha',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Software Development :: Quality Assurance',
]
dependencies = [
    'httpx>=0.27',
    'typer>=0.12',
    'mcp>=1.0',
    'pydantic>=2.6',
]

[project.optional-dependencies]
# Browser-driving extras. Pulls in Playwright so `agentclip clip` and
# the MCP server can drive a real Chromium instance. Skipped by default
# because most agent runtimes (Claude Code's tool harness, e.g.) bring
# their own browser substrate; only standalone CLI users need this.
#
# Install with: pip install 'agentclip[browser]'
# First-run setup will then download Chromium binaries automatically.
browser = [
    'playwright>=1.49',
]

dev = [
    'pytest>=8.0',
    'pytest-asyncio>=0.23',
    'pytest-httpx>=0.30',
    'ruff>=0.5',
]

[project.scripts]
agentclip = 'agentclip.cli:app'
agentclip-mcp = 'agentclip.mcp_server:main'

[project.urls]
Homepage = 'https://github.com/ericelizes1/agentclip-python'
Repository = 'https://github.com/ericelizes1/agentclip-python'
Issues = 'https://github.com/ericelizes1/agentclip-python/issues'

[tool.hatch.build.targets.wheel]
packages = ['src/agentclip']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'N', 'SIM']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
