[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'qagent'
version = '0.1.0'
description = 'Turn AI agent QA runs into shareable slideshows.'
readme = 'README.md'
requires-python = '>=3.11'
license = { text = 'MIT' }
authors = [{ name = 'Eric Elizes', email = 'eric@elizes.dev' }]
keywords = ['mcp', 'ai-agents', 'qa', 'slideshow', 'claude-code']
classifiers = [
    'Development Status :: 3 - Alpha',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Software Development :: Quality Assurance',
]
dependencies = [
    'httpx>=0.27',
    'typer>=0.12',
    'mcp>=1.0',
    'pydantic>=2.6',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0',
    'pytest-asyncio>=0.23',
    'pytest-httpx>=0.30',
    'ruff>=0.5',
]

[project.scripts]
qagent = 'qagent.cli:app'
qagent-mcp = 'qagent.mcp_server:main'

[project.urls]
Homepage = 'https://github.com/ericelizes/qagent'
Repository = 'https://github.com/ericelizes/qagent'
Issues = 'https://github.com/ericelizes/qagent/issues'

[tool.hatch.build.targets.wheel]
packages = ['src/qagent']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'N', 'SIM']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
asyncio_mode = 'auto'
