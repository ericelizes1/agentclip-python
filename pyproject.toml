[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'agentclip'
version = '0.9.0'
description = 'Create narrated, shareable video walkthroughs from AI agent browser work.'
readme = 'README.md'
requires-python = '>=3.11'
license = { text = 'MIT' }
authors = [{ name = 'Eric Elizes', email = 'eric@elizes.dev' }]
keywords = ['mcp', 'ai-agents', 'qa', 'video', 'codex', 'opencode', 'claude-code']
classifiers = [
    'Development Status :: 3 - Alpha',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Software Development :: Quality Assurance',
]
dependencies = [
    'httpx>=0.27',
    'typer>=0.12',
    'mcp>=1.0',
    'pydantic>=2.6',
    'playwright>=1.49',
    'pillow>=10.0',
]

[project.optional-dependencies]
# Empty alias kept so `pip install 'agentclip[browser]'` (in old docs,
# install scripts, dotfiles) still resolves cleanly. The deps it used
# to add are in core now.
browser = []

dev = [
    'pytest>=9.0.3',
    'pytest-asyncio>=0.23',
    'pytest-httpx>=0.30',
    'ruff>=0.5',
]

[project.scripts]
agentclip = 'agentclip.cli:app'
agentclip-mcp = 'agentclip.mcp_server:main'

[project.urls]
Homepage = 'https://github.com/ericelizes1/agentclip-python'
Repository = 'https://github.com/ericelizes1/agentclip-python'
Issues = 'https://github.com/ericelizes1/agentclip-python/issues'

[tool.hatch.build.targets.wheel]
packages = ['src/agentclip']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'N', 'SIM']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.uv]
exclude-newer = "7 days"
